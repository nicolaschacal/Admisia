services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-admisia}
      POSTGRES_USER: ${POSTGRES_USER:-admisia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admisia} -d ${POSTGRES_DB:-admisia}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-admisia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-admisia}
      DB_SSL: "false"
      NODE_ENV: production
    command: >
      sh -c "node scripts/migrate.js &&
      if [ -n \"$$CRM_ADMIN_PASSWORD\" ]; then node scripts/create-admin.js; fi &&
      node server/index.js"
    networks:
      - private
      - public

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public

networks:
  private:
    internal: true
  public:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

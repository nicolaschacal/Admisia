<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Presentación de AdmisIA</title>
  <desc id="desc">Vista previa del video de presentación de AdmisIA. Haz clic para verlo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="720" rx="24" fill="url(#bg)"/>
  <circle cx="1120" cy="120" r="210" fill="#2563eb" opacity="0.12"/>
  <circle cx="180" cy="650" r="250" fill="#60a5fa" opacity="0.08"/>
  <text x="640" y="245" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700">AdmisIA</text>
  <text x="640" y="315" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="30">Asistente de admisiones con IA para colegios</text>
  <g filter="url(#shadow)">
    <circle cx="640" cy="445" r="76" fill="#2563eb"/>
    <path d="M618 400 L618 490 L690 445 Z" fill="#fff"/>
  </g>
  <text x="640" y="590" text-anchor="middle" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="24">▶ Ver presentación</text>
</svg>

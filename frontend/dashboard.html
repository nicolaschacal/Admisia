<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Panel de admisiones</title>
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card"><img class="auth-logo" alt=""><h1 data-brand-name>AdmisIA</h1><p class="muted">Panel de admisiones</p><form id="login-form"><label class="field"><span>Correo</span><input name="email" type="email" autocomplete="username" required></label><label class="field"><span>Contraseña</span><input name="password" type="password" autocomplete="current-password" required></label><div id="login-error" class="form-error" hidden></div><button class="btn btn-primary" type="submit">Ingresar</button></form><form id="setup-form" hidden><label class="field"><span>Nombre</span><input name="name" required></label><label class="field"><span>Correo</span><input name="email" type="email" required></label><label class="field"><span>Contraseña</span><input name="password" type="password" minlength="10" required></label><div id="setup-error" class="form-error" hidden></div><button class="btn btn-primary" type="submit">Crear administrador</button></form></div>
  </div>
  <div id="crm-app" hidden>
    <aside id="sidebar"><div class="brand"><img class="brand-logo" alt=""><span data-brand-name>Panel de admisiones</span></div><nav></nav></aside><div id="sidebar-scrim"></div>
    <main><header><div><button id="menu-toggle" class="icon-btn" aria-label="Menú">☰</button><h1 id="view-title">Resumen</h1></div><div><span id="manager-name"></span><span id="manager-role"></span><span id="user-avatar"></span></div></header><section id="view" class="view" aria-live="polite"></section></main>
  </div>
  <div id="lead-modal" class="drawer-backdrop" hidden><section class="drawer" role="dialog" aria-modal="true" aria-label="Ficha del candidato"><header class="drawer-head"><h2 id="drawer-title">Candidato</h2><button id="close-lead" class="icon-btn" aria-label="Cerrar">×</button></header><div id="lead-detail" class="drawer-body"></div></section></div>
  <div id="dialog" class="dialog-backdrop" hidden><section class="dialog" role="dialog" aria-modal="true"><div id="dialog-body"></div></section></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/js/dashboard.js"></script>
  <script src="/js/ai-integrations.js"></script>
</body>
</html>
